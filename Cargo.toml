[package]
name = "copal-tm"
description = "The Copal task manager: an instrument panel and a process browser for the terminal"
version = "0.1.1"
edition = "2021"
rust-version = "1.70"
license = "MIT"
authors = ["Paul Richeson", "Claude"]
repository = "https://github.com/vonglurt/copal-tm"
readme = "README.md"
keywords = ["task-manager", "tui", "procfs", "process", "monitor"]
categories = ["command-line-utilities"]

# One crate, named after the program, with nothing underneath it.  The
# terminal layer, the readings and the widgets are modules -- `tty`,
# `machine` and `ui` -- because they are one program and they version, build
# and publish as one thing.
#
# No external crates, and that is the design.  orrery states the reason: a
# fleet node never reaches the internet, so a dependency is a crate fetch
# that fails on the one machine this is meant to run on.  This section is
# empty and stays empty.
[dependencies]

[lib]
name = "copal_tm"
path = "src/lib.rs"

[[bin]]
name = "copal-tm"
path = "src/main.rs"

# The instrument panel redraws every cell it owns each tick; a debug build of
# a per-cell inner loop is slow enough to be visible, so dev is optimised too.
[profile.dev]
opt-level = 2

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
