[package]
name = "copal-tm"
description = "The Copal task manager: an instrument panel and a process browser for the terminal"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
readme = "../../README.md"
keywords = ["task-manager", "tui", "procfs", "process", "monitor"]
categories = ["command-line-utilities"]

[[bin]]
name = "copal-tm"
path = "src/main.rs"

[dependencies]
copal-tm-tty = { workspace = true }
copal-tm-probe = { workspace = true }
copal-tm-ui = { workspace = true }
